
services:
  postgres:
    image: postgres:16-alpine
    container_name: textile_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: textile_db
    ports:
      - '5448:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - textile_network

  redis:
    image: redis:7-alpine
    container_name: textile_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - textile_network

  main-api:
    build:
      context: ..
      dockerfile: docker/main-api.Dockerfile
    container_name: textile_main_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5448/textile_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-secret-key
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis
    networks:
      - textile_network
    volumes:
      - ../apps/main-api/src:/app/apps/main-api/src

  otp-service:
    build:
      context: ..
      dockerfile: docker/otp-service.Dockerfile
    container_name: textile_otp_service
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      - redis
    networks:
      - textile_network
    volumes:
      - ../apps/otp-service/src:/app/apps/otp-service/src

volumes:
  postgres_data:
  redis_data:

networks:
  textile_network:
    driver: bridge